services:
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    image: 748241639517.dkr.ecr.us-east-1.amazonaws.com/expense-tracker-dev-backend:1.0.4
    container_name: backend
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/expense
    expose:
      - "3000"
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    image: 748241639517.dkr.ecr.us-east-1.amazonaws.com/expense-tracker-dev-frontend:1.0.4
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
    name: mongo-data
