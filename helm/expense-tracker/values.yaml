global:
  imagePullSecrets:
    - name: ecr-secret

frontend:
  replicaCount: 2

  podLabels:
    rollout-experiment: "m09"

  image:
    repository: 748241639517.dkr.ecr.us-east-1.amazonaws.com/expense-tracker-dev-frontend
    tag: "1.0.4"
    pullPolicy: IfNotPresent
  service:
    port: 80
    annotations:
      gitops-demo: "milestone-5-change-detection"
      gitops-demo-auto-sync: "milestone-6-automatic-reconciliation"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  ingress:
    enabled: true
    className: nginx
    host: expense.example.test
    path: /
    pathType: Prefix

backend:
  replicaCount: 1
  image:
    repository: 748241639517.dkr.ecr.us-east-1.amazonaws.com/expense-tracker-dev-backend
    tag: "1.0.6"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  config:
    port: "3000"
    mongoUrl: mongodb://mongodb:27017/expense
  secret:
    existingSecret: backend-secret
    secretKey: APP_SECRET
  probes:
    startup:
      path: /health
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12
    readiness:
      path: /ready
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      path: /health
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

mongodb:
  replicaCount: 1
  image:
    repository: mongo
    tag: "4.4"
    pullPolicy: IfNotPresent
  service:
    port: 27017
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
