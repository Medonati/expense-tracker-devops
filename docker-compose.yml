services:
  mongodb:
    image: mongo:4.4
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    restart: unless-stopped

  backend:
    build:
      context: ./app/backend
      dockerfile: ../../docker/backend/Dockerfile

    container_name: backend

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/expense
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    depends_on:
      - mongodb

    restart: unless-stopped

volumes:
  mongo-data:
